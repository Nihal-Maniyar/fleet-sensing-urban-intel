<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet Sensing Urban Intel — GIS Dashboard (Pune)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<!-- Leaflet GIS Mapping Engine -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --font-display:'Space Grotesk','Segoe UI',sans-serif;
  --font-body:'Inter','Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',monospace;

  --ink:#101826;
  --ink-soft:#5B6472;
  --ink-faint:#8A93A3;
  --surface:#FFFFFF;
  --surface-sunken:#F3F5F9;
  --surface-raised:#FFFFFF;
  --border:#E1E5EC;
  --border-soft:#EDF0F4;

  --navy:#0E1B2C;
  --navy-soft:#16283F;
  --navy-line:#24384F;

  --teal:#1C6E8C;
  --teal-ink:#0F4A61;
  --teal-soft:#E3F0F4;

  --amber:#CC7A2E;
  --amber-soft:#FBEEDD;

  --green:#2E7D53;
  --green-soft:#E3F3E9;

  --red:#B94A3B;
  --red-soft:#F8E5E2;

  --purple:#5B3FA8;
  --purple-soft:#EFEAF8;

  --shadow-sm:0 1px 3px rgba(16,24,38,0.06);
  --shadow-md:0 6px 20px rgba(16,24,38,0.08);
  --radius:10px;
  --radius-sm:6px;

  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDEFF3; --ink-soft:#AEB6C4; --ink-faint:#7A8497;
    --surface:#141B27; --surface-sunken:#0F1622; --surface-raised:#1A2331;
    --border:#263042; --border-soft:#1E2735;
    --teal-soft:#173038; --amber-soft:#2E2416; --green-soft:#16281E; --red-soft:#2C1B18; --purple-soft:#251C38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEFF3; --ink-soft:#AEB6C4; --ink-faint:#7A8497;
  --surface:#141B27; --surface-sunken:#0F1622; --surface-raised:#1A2331;
  --border:#263042; --border-soft:#1E2735;
  --teal-soft:#173038; --amber-soft:#2E2416; --green-soft:#16281E; --red-soft:#2C1B18; --purple-soft:#251C38;
  color-scheme: dark;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:var(--surface-sunken);
  color:var(--ink);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

/* ============ APP SHELL ============ */
.app{ display:flex; min-height:100%; }

/* Sidebar */
.sidebar{
  width:235px; min-width:235px;
  background:var(--navy);
  color:#DDE4EE;
  display:flex; flex-direction:column;
  padding:18px 12px calc(16px + env(safe-area-inset-bottom,0px));
  position:sticky; top:0; align-self:flex-start; height:100vh;
}
.brand{ display:flex; align-items:center; gap:10px; padding:6px 10px 20px; }
.brand-mark{
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(145deg, var(--teal), #10344c);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.25);
}
.brand-text .t1{ font-family:var(--font-display); font-weight:700; font-size:15px; line-height:1.15; color:#F3F6FA;}
.brand-text .t2{ font-size:10.5px; color:#8FA0B8; letter-spacing:.02em; margin-top:2px;}

.nav{ display:flex; flex-direction:column; gap:3px; margin-top:8px; flex:1; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:10px 12px; border-radius:8px;
  color:#B7C2D2; background:transparent; border:none; width:100%; text-align:left;
  font-size:13.5px; font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.9;}
.nav-item:hover{ background:var(--navy-soft); color:#F0F3F8; }
.nav-item.active{ background:var(--teal); color:#fff; font-weight:600;}
.nav-item .cnt{
  margin-left:auto; font-size:10.5px; font-family:var(--font-mono);
  background:rgba(255,255,255,0.12); padding:1px 6px; border-radius:999px; color:#EAF0F6;
}
.nav-item.active .cnt{ background:rgba(255,255,255,0.25); }

.sidebar-foot{
  margin-top:10px; padding:12px 12px 4px; border-top:1px solid var(--navy-line);
  font-size:11px; color:#7488A0; line-height:1.5;
}
.sidebar-foot b{ color:#B7C2D2; }

/* Main Column */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }

/* Topbar */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 22px; display:flex; align-items:center; gap:16px;
}
.topbar h1{ font-family:var(--font-display); font-size:17.5px; font-weight:700; white-space:nowrap;}
.topbar .sub{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; white-space:nowrap;}
.search{
  flex:1; max-width:340px; display:flex; align-items:center; gap:8px;
  background:var(--surface-sunken); border:1px solid var(--border); border-radius:999px;
  padding:7px 14px; color:var(--ink-faint); font-size:12.5px;
}
.search input{
  border:none; background:transparent; outline:none; font-family:inherit; font-size:12.5px; color:var(--ink); width:100%;
}
.search svg{ width:14px; height:14px; flex-shrink:0;}

.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.datasource{
  display:flex; align-items:center; gap:7px;
  border:1px solid var(--border); border-radius:999px; padding:6px 12px 6px 10px;
  font-size:11.5px; font-weight:600; background:var(--surface-sunken); position:relative;
}
.dot{ width:7px; height:7px; border-radius:50%; background:var(--green); flex-shrink:0;}
.dot.pulse{ box-shadow:0 0 0 0 rgba(46,125,83,.5); animation:pulse 2s infinite;}
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(46,125,83,.45);} 70%{box-shadow:0 0 0 7px rgba(46,125,83,0);} 100%{box-shadow:0 0 0 0 rgba(46,125,83,0);} }
.dot.offline{ background:var(--red); animation:none;}

.clock{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
.iconbtn{
  width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); display:flex; align-items:center; justify-content:center; position:relative;
}
.iconbtn svg{ width:16px; height:16px; color:var(--ink-soft);}
.iconbtn:hover{ background:var(--surface-sunken); }

/* Content */
.content{ padding:20px 22px 48px; max-width:1440px; width:100%; margin:0 auto; }
.kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; box-shadow:var(--shadow-sm);
}
.kpi .label{ font-size:11px; color:var(--ink-faint); font-weight:600; display:flex; justify-content:space-between; align-items:center;}
.kpi .value{ font-family:var(--font-display); font-size:26px; font-weight:700; margin-top:5px;}
.kpi .delta{ font-size:11px; margin-top:4px; font-weight:600;}
.kpi .delta.up{ color:var(--green);} .kpi .delta.down{ color:var(--red);}

.grid-2{ display:grid; grid-template-columns:1.65fr 1fr; gap:14px; align-items:start;}
.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); overflow:hidden;
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; border-bottom:1px solid var(--border-soft);
}
.panel-head h3{ font-family:var(--font-display); font-size:13.5px; font-weight:700;}
.panel-head .link{ font-size:11.5px; color:var(--teal); font-weight:600; cursor:pointer;}
.panel-body{ padding:14px 16px; }

/* ============ REAL GIS MAP (LEAFLET) ============ */
.gis-map-container{
  width:100%; height:460px; position:relative; background:#E5ECE8;
}
#leafletMap{ width:100%; height:100%; z-index:10; }

/* Custom Leaflet Pin Styling */
.custom-leaflet-pin{ background:none; border:none; }
.leaflet-defect-pin{
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:13px; font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,0.35); border:2px solid #fff;
  cursor:pointer; position:relative;
}
.leaflet-defect-pin.type-pothole{ background:var(--red); }
.leaflet-defect-pin.type-garbage{ background:var(--green); }
.leaflet-defect-pin.type-traffic_obstruction{ background:var(--amber); }
.leaflet-defect-pin.type-pedestrian_risk{ background:var(--purple); }

.leaflet-defect-pin.sev-high .pulse-ring{
  position:absolute; inset:-6px; border-radius:50%;
  border:2px solid var(--red); opacity:0.8;
  animation:pinPulse 1.8s cubic-bezier(0.24,0,0.38,1) infinite;
}
@keyframes pinPulse{
  0%{ transform:scale(0.8); opacity:0.9; }
  100%{ transform:scale(1.8); opacity:0; }
}

.leaflet-bus-pin{
  background:var(--navy); color:#fff; border:1.5px solid #fff;
  border-radius:4px; padding:2px 6px; font-size:10px; font-family:var(--font-mono);
  font-weight:700; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,0.3);
}

.map-toolbar{
  position:absolute; top:12px; right:12px; z-index:15;
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:6px 10px; font-size:11px; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; gap:4px;
}
.map-toolbar label{ display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:500;}
.map-badge{
  position:absolute; bottom:12px; left:12px; z-index:15;
  background:rgba(14,27,44,0.88); color:#fff;
  font-size:10.5px; padding:5px 11px; border-radius:999px; font-family:var(--font-mono);
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
}

/* Tables */
table{ width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  text-align:left; font-size:10.5px; color:var(--ink-faint); font-weight:700;
  padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{ padding:10px 10px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
tbody tr{ transition:background .12s ease; cursor:pointer;}
tbody tr:hover{ background:var(--surface-sunken); }
.mono{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft);}

.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;
  padding:3px 8px; border-radius:999px; white-space:nowrap;
}
.badge.sev-high{ background:var(--red-soft); color:var(--red);}
.badge.sev-medium{ background:var(--amber-soft); color:var(--amber);}
.badge.sev-low{ background:var(--green-soft); color:var(--green);}
.badge.st-reported{ background:var(--amber-soft); color:var(--amber);}
.badge.st-acknowledged{ background:var(--teal-soft); color:var(--teal-ink);}
.badge.st-inprogress{ background:var(--purple-soft); color:var(--purple);}
.badge.st-resolved{ background:var(--green-soft); color:var(--green);}
.badge.type{ background:var(--surface-sunken); color:var(--ink-soft); border:1px solid var(--border);}

.filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
select, .btn, input[type=text]{
  font-family:inherit; font-size:12px; border:1px solid var(--border); border-radius:8px;
  padding:7px 11px; background:var(--surface); color:var(--ink);
}
.btn{ font-weight:600; display:inline-flex; align-items:center; gap:6px; cursor:pointer;}
.btn.primary{ background:var(--teal); border-color:var(--teal); color:#fff; }
.btn.primary:hover{ background:var(--teal-ink); }
.btn.ghost{ background:transparent; }
.btn.ghost:hover{ background:var(--surface-sunken); }
.btn.sm{ padding:6px 10px; font-size:11.5px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* Drawers */
.overlay{
  position:fixed; inset:0; background:rgba(10,16,26,0.48); z-index:70;
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.overlay.open{ opacity:1; pointer-events:auto; }
.drawer{
  position:fixed; top:0; right:0; height:100%; width:min(460px,94vw); z-index:71;
  background:var(--surface); box-shadow:-12px 0 32px rgba(10,16,26,0.22);
  transform:translateX(100%); transition:transform .22s cubic-bezier(0.16,1,0.3,1);
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{ transform:translateX(0); }
.drawer-head{ padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:10px;}
.drawer-head .x{ margin-left:auto; }
.drawer-body{ padding:16px 18px; overflow-y:auto; flex:1; }
.drawer-foot{ padding:14px 18px; border-top:1px solid var(--border); display:flex; gap:8px; }

.kv{ display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:12.5px; }
.kv dt{ color:var(--ink-faint); font-weight:600; }
.kv dd{ font-weight:600; }

.evidence-shot{
  border-radius:8px; overflow:hidden; border:1px solid var(--border);
  background:var(--surface-sunken); position:relative;
}

.stepper{ display:flex; flex-direction:column; gap:0; margin-top:6px;}
.step{ display:flex; gap:10px; position:relative; padding-bottom:18px;}
.step:last-child{ padding-bottom:0; }
.step .node{ width:16px; height:16px; border-radius:50%; border:2.5px solid var(--border); background:var(--surface); flex-shrink:0; margin-top:1px; z-index:1;}
.step.done .node{ background:var(--teal); border-color:var(--teal); }
.step.current .node{ background:#fff; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft);}
.step:not(:last-child)::before{
  content:''; position:absolute; left:7.5px; top:16px; bottom:0; width:1.5px; background:var(--border);
}
.step.done:not(:last-child)::before{ background:var(--teal); }
.step .stitle{ font-size:12.5px; font-weight:700; }
.step .stime{ font-size:11px; color:var(--ink-faint); margin-top:1px;}

.section-title{ font-size:11px; font-weight:700; color:var(--ink-faint); margin:16px 0 8px; letter-spacing:.01em;}
.section-title:first-child{ margin-top:0; }

/* Buses Grid */
.bus-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px;}
.bus-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow-sm); }
.bus-card .top{ display:flex; justify-content:space-between; align-items:flex-start;}
.bus-card .id{ font-family:var(--font-mono); font-weight:700; font-size:14px;}
.bus-card .route{ font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
.status-pill{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; display:flex; align-items:center; gap:5px;}
.status-pill.online{ background:var(--green-soft); color:var(--green);}
.status-pill.offline{ background:var(--surface-sunken); color:var(--ink-faint); border:1px solid var(--border);}
.bus-meta{ display:flex; gap:14px; margin-top:12px; font-size:11.5px; }
.bus-meta div span{ display:block; color:var(--ink-faint); font-size:10px; margin-bottom:2px;}

/* Kanban */
.kanban{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.kcol-head{ display:flex; align-items:center; justify-content:space-between; padding:0 2px 10px; }
.kcol-head h4{ font-size:12px; font-weight:700; }
.kcol-head .n{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
.kcol-body{ display:flex; flex-direction:column; gap:8px; min-height:60px; }
.tcard{ background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:12px; box-shadow:var(--shadow-sm); }
.tcard .tid{ font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--teal-ink);}
.tcard .ttype{ font-size:12.5px; font-weight:600; margin-top:4px;}
.tcard .tloc{ font-size:11px; color:var(--ink-soft); margin-top:2px;}
.tcard .tfoot{ display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
.sla{ font-size:10px; font-family:var(--font-mono); color:var(--ink-faint);}

/* Settings */
.setting-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--border-soft); gap:16px;}
.setting-row:last-child{ border-bottom:none;}
.setting-row .lbl{ font-size:12.5px; font-weight:600;}
.setting-row .hint{ font-size:11px; color:var(--ink-faint); margin-top:2px;}
.contract-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
.contract-item{ background:var(--surface-sunken); border:1px solid var(--border); border-radius:8px; padding:9px 11px;}
.contract-item .k{ font-size:10px; color:var(--ink-faint); font-family:var(--font-mono);}
.contract-item .v{ font-size:13px; font-weight:700; font-family:var(--font-mono); margin-top:2px;}

.empty{ text-align:center; padding:36px 10px; color:var(--ink-faint); font-size:12.5px;}

@media (max-width:920px){
  .sidebar{ display:none; }
  .kpi-row{ grid-template-columns:repeat(2,1fr); }
  .grid-2{ grid-template-columns:1fr; }
  .kanban{ grid-template-columns:1fr 1fr; }
  .search{ display:none; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <nav class="sidebar">
    <div class="brand">
      <div class="brand-mark">🛰️</div>
      <div class="brand-text">
        <div class="t1">Fleet Sensing<br>Urban Intel</div>
        <div class="t2">Pune Municipal GIS</div>
      </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">
      Prototype for <b>SIH 2026</b><br>
      Live GIS & Fleet Fusion
    </div>
  </nav>

  <!-- ============ MAIN COLUMN ============ -->
  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">GIS Operations Dashboard</h1>
        <div class="sub" id="pageSub">Live Pune municipal fleet sensing & road defect intelligence</div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="globalSearch" placeholder="Search incidents, tickets, corridors…" oninput="handleSearch(this.value)">
      </div>
      <div class="topbar-right">
        <button class="btn sm ghost" id="seedDataBtn" onclick="triggerSeedData()" title="Populate/Reset working Pune demonstration data">
          🌱 Seed Working Data
        </button>
        <div class="datasource" id="dsIndicator" title="Live sync polling every 4s">
          <span class="dot pulse" id="syncDot"></span> <span id="syncText">Connecting…</span>
        </div>
        <div class="clock" id="clock">—</div>
        <button class="iconbtn" id="refreshBtn" onclick="fetchLiveBackendData(true)" title="Force Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button class="iconbtn" id="themeBtn" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- ============ SLIDE-OVER DRAWER ============ -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<script>
/* =========================================================================
   FLEET SENSING URBAN INTEL — REAL GIS DASHBOARD (PUNE MUNICIPAL PILOT)
   ========================================================================= */

// Preferences
function getPref(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function setPref(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

// Theme
(function initTheme(){
  const saved = getPref('fsui_theme', null);
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = (cur === 'dark' || (!cur && prefersDark)) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  setPref('fsui_theme', next);
});

// Clock
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleString('en-IN',{ day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) + ' IST';
}
tickClock(); setInterval(tickClock, 30000);

// Global State (Dynamic Live Data, Zero Dummy Arrays)
const state = {
  route: 'dashboard',
  backendConnected: false,
  lastSyncTime: null,
  stats: {
    total_events: 0,
    total_observations: 0,
    total_incidents: 0,
    verified_incidents: 0,
    open_tickets: 0,
    resolved_tickets: 0,
    fleet_total: 0,
    fleet_online: 0,
  },
  incidents: [],
  tickets: [],
  observations: [],
  fleet: [],
  routesGeoJSON: null,
  searchQuery: '',
  selectedIncident: null,
  leafletMap: null,
  markersLayer: null,
  routesLayer: null,
  busesLayer: null,
};

const ROUTES = [
  { id:'dashboard', label:'GIS Dashboard', sub:'Live map & civic sensing overview' },
  { id:'buses', label:'Fleet & Edge AI', sub:'Bus telemetrics & edge health' },
  { id:'incidents', label:'Incidents', sub:'Road defects & verified hazards' },
  { id:'tickets', label:'Civic Tickets', sub:'Work order lifecycle & SLA dispatch' },
  { id:'authorities', label:'Authorities', sub:'Department workloads & assignments' },
  { id:'settings', label:'Settings', sub:'Contract thresholds & platform controls' },
];

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = ROUTES.map(r=>{
    let countBadge = '';
    if(r.id==='incidents') countBadge = `<span class="cnt">${state.incidents.length}</span>`;
    if(r.id==='tickets') countBadge = `<span class="cnt">${state.tickets.length}</span>`;
    if(r.id==='buses') countBadge = `<span class="cnt">${state.fleet.length}</span>`;

    return `
      <button class="nav-item ${r.id===state.route?'active':''}" data-route="${r.id}">
        <span>${r.label}</span>
        ${countBadge}
      </button>`;
  }).join('');

  nav.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.route = btn.dataset.route;
      render();
    });
  });
}

function updateSyncIndicator(connected){
  state.backendConnected = connected;
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if(connected){
    dot.className = 'dot pulse';
    txt.textContent = 'API Live';
    txt.style.color = 'var(--green)';
  } else {
    dot.className = 'dot offline';
    txt.textContent = 'Offline';
    txt.style.color = 'var(--red)';
  }
}

/* ============ FETCH LIVE DATA FROM BACKEND ============ */
async function fetchLiveBackendData(manual=false){
  try {
    const [statsRes, incRes, tktRes, fltRes, rtsRes] = await Promise.all([
      fetch('/api/v1/stats'),
      fetch('/api/v1/incidents'),
      fetch('/api/v1/tickets'),
      fetch('/api/v1/fleet'),
      fetch('/api/v1/routes/geojson'),
    ]);

    if(statsRes.ok) state.stats = await statsRes.json();
    if(incRes.ok){
      const incData = await incRes.json();
      state.incidents = incData.incidents || [];
    }
    if(state.incidents.length === 0 && !state.hasAutoSeeded){
      state.hasAutoSeeded = true;
      try {
        const seedRes = await fetch('/api/v1/demo/seed', { method: 'POST' });
        if(seedRes.ok) return fetchLiveBackendData();
      } catch(e){}
    }
    if(tktRes.ok){
      const tktData = await tktRes.json();
      state.tickets = tktData.tickets || [];
    }
    if(fltRes.ok){
      const fltData = await fltRes.json();
      state.fleet = fltData.fleet || [];
    }
    if(rtsRes.ok){
      state.routesGeoJSON = await rtsRes.json();
    }

    state.lastSyncTime = new Date();
    updateSyncIndicator(true);

    // Update UI
    renderNav();
    if(state.route === 'dashboard') {
      updateDashboardStats();
      updateDashboardTable();
      updateLeafletLayers();
    } else {
      renderPage();
    }
  } catch (err) {
    console.warn("Backend sync check failed:", err);
    updateSyncIndicator(false);
  }
}

// Auto-seed working demo data on demand
async function triggerSeedData(){
  try {
    const res = await fetch('/api/v1/demo/seed', { method: 'POST' });
    if(res.ok){
      await fetchLiveBackendData();
      alert("Working Pune transit demonstration dataset loaded successfully!");
    }
  } catch (err) {
    alert("Could not reach backend API to seed data: " + err);
  }
}

// Global Search
function handleSearch(val){
  state.searchQuery = (val||'').toLowerCase().trim();
  if(state.route==='incidents'||state.route==='dashboard') renderPage();
}

/* ============ REAL GIS MAP INITIALIZATION (LEAFLET) ============ */
function initLeafletMap(){
  const mapEl = document.getElementById('leafletMap');
  if(!mapEl) return;

  // Clean up existing map instance if any
  if(state.leafletMap){
    try { state.leafletMap.remove(); } catch(e){}
    state.leafletMap = null;
  }

  // Check if Leaflet library is available
  if(typeof L === 'undefined'){
    mapEl.innerHTML = `
      <div class="empty" style="padding:60px 20px;">
        <b>Leaflet GIS CDN is offline.</b><br>
        <span style="font-size:11px;">The system is operating in isolated sandbox mode. Real coordinates remain active.</span>
      </div>`;
    return;
  }

  // Pune Central Coordinates
  const PUNE_CENTER = [18.5204, 73.8436];
  const map = L.map('leafletMap', {
    center: PUNE_CENTER,
    zoom: 13,
    zoomControl: true,
    attributionControl: true
  });

  // Real OpenStreetMap Tile Layer
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  state.leafletMap = map;
  state.routesLayer = L.layerGroup().addTo(map);
  state.markersLayer = L.layerGroup().addTo(map);
  state.busesLayer = L.layerGroup().addTo(map);

  // Initial draw
  updateLeafletLayers();
}

function updateLeafletLayers(){
  if(!state.leafletMap || typeof L === 'undefined') return;

  // 1. Draw Pune Transit Routes
  state.routesLayer.clearLayers();
  if(state.routesGeoJSON && state.routesGeoJSON.features){
    L.geoJSON(state.routesGeoJSON, {
      style: function(f){
        return {
          color: f.properties.color || '#1C6E8C',
          weight: 4.5,
          opacity: 0.85,
          lineJoin: 'round'
        };
      },
      onEachFeature: function(f, layer){
        layer.bindTooltip(`<b>${f.properties.name}</b><br><span style="font-size:10.5px;">${f.properties.description}</span>`, { sticky: true });
      }
    }).addTo(state.routesLayer);
  }

  // 2. Draw Incident Markers
  state.markersLayer.clearLayers();
  const filtered = filterIncidents(state.incidents);

  filtered.forEach(inc=>{
    if(!inc.latitude || !inc.longitude) return;

    const typeIcons = {
      POTHOLE: '🕳️',
      GARBAGE: '🗑️',
      TRAFFIC_OBSTRUCTION: '🚧',
      PEDESTRIAN_RISK: '🚶'
    };
    const iconSym = typeIcons[inc.event_type] || '⚠️';

    const pinHtml = `
      <div class="leaflet-defect-pin sev-${(inc.severity||'MEDIUM').toLowerCase()} type-${(inc.event_type||'POTHOLE').toLowerCase()}">
        ${inc.severity==='HIGH' ? '<div class="pulse-ring"></div>' : ''}
        <span>${iconSym}</span>
      </div>`;

    const customIcon = L.divIcon({
      className: 'custom-leaflet-pin',
      html: pinHtml,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -14]
    });

    const marker = L.marker([inc.latitude, inc.longitude], { icon: customIcon });

    marker.bindPopup(`
      <div style="font-family:var(--font-body);padding:2px 4px;min-width:180px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
          <b style="font-family:var(--font-mono);font-size:12px;">${inc.incident_id}</b>
          <span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--surface-sunken);">${inc.status}</span>
        </div>
        <div style="font-size:12px;font-weight:600;margin-top:4px;">${(inc.event_type||'').replace('_',' ')}</div>
        <div style="font-size:11px;color:var(--ink-faint);">${inc.locality || 'Pune Corridor'}</div>
        <div style="font-size:11px;margin-top:4px;">Confidence: <b>${Math.round((inc.confidence||0.9)*100)}%</b></div>
        <div style="margin-top:8px;border-top:1px solid #eee;padding-top:6px;display:flex;justify-content:space-between;">
          <a href="javascript:void(0)" onclick="openIncidentDrawer('${inc.incident_id}')" style="color:var(--teal);font-weight:700;font-size:11px;">Inspect Details →</a>
          <a href="https://www.google.com/maps?q=${inc.latitude},${inc.longitude}" target="_blank" style="color:var(--ink-faint);font-size:11px;">Maps ↗</a>
        </div>
      </div>
    `);

    marker.addTo(state.markersLayer);
  });

  // 3. Draw Bus Fleet Markers
  state.busesLayer.clearLayers();
  state.fleet.forEach(b=>{
    if(!b.latitude || !b.longitude) return;

    const busIcon = L.divIcon({
      className: 'custom-leaflet-pin',
      html: `<div class="leaflet-bus-pin" style="${b.status==='OFFLINE'?'opacity:0.5;':''}"><span style="color:${b.status==='ONLINE'?'#48bb78':'#fc8181'}">●</span> ${b.bus_id}</div>`,
      iconSize: [60, 22],
      iconAnchor: [30, 11]
    });

    const bMarker = L.marker([b.latitude, b.longitude], { icon: busIcon });
    bMarker.bindTooltip(`<b>${b.bus_id}</b> (${b.status})<br>${b.route_name}`);
    bMarker.on('click', () => openBusDrawer(b.bus_id));
    bMarker.addTo(state.busesLayer);
  });
}

function filterIncidents(list){
  let result = list;
  if(state.searchQuery){
    const q = state.searchQuery;
    result = result.filter(i=>{
      return (i.incident_id||'').toLowerCase().includes(q) ||
             (i.event_type||'').toLowerCase().includes(q) ||
             (i.locality||'').toLowerCase().includes(q) ||
             (i.description||'').toLowerCase().includes(q) ||
             (i.ticket_id||'').toLowerCase().includes(q);
    });
  }
  return result;
}

function gmapsLink(lat,lng){ return `https://www.google.com/maps?q=${lat},${lng}`; }
function sevBadge(sev){ return `<span class="badge sev-${(sev||'MEDIUM').toLowerCase()}">${sev||'MEDIUM'}</span>`; }
function statusBadge(st){
  const map = { VERIFIED:'st-acknowledged', verified:'st-acknowledged', PENDING:'st-reported', pending:'st-reported', REPORTED:'st-reported', ACKNOWLEDGED:'st-acknowledged', IN_PROGRESS:'st-inprogress', RESOLVED:'st-resolved' };
  return `<span class="badge ${map[st]||'st-reported'}">${(st||'REPORTED').replace('_',' ')}</span>`;
}
function fmtTime(iso){
  if(!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleString('en-IN',{ day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
  } catch(e){ return iso; }
}

/* ============ DRAWERS (INCIDENT & TICKET) ============ */
function openDrawer(headHTML, bodyHTML, footHTML){
  document.getElementById('drawerHead').innerHTML = headHTML;
  document.getElementById('drawerBody').innerHTML = bodyHTML;
  document.getElementById('drawerFoot').innerHTML = footHTML || '';
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
document.getElementById('overlay').addEventListener('click', closeDrawer);

function openIncidentDrawer(id){
  const inc = state.incidents.find(i=>i.incident_id===id);
  if(!inc) return;
  const ticket = state.tickets.find(t=>t.incident_id===id || t.ticket_id===inc.ticket_id);

  const head = `
    <div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="badge type">${(inc.event_type||'').replace('_',' ')}</span>
        ${statusBadge(inc.status)}
      </div>
      <h3 style="font-family:var(--font-display);font-size:16px;margin-top:8px;">${inc.incident_id}</h3>
      <div class="mono" style="margin-top:2px;">${inc.locality || 'Pune Corridor'}</div>
    </div>
    <button class="iconbtn x" onclick="closeDrawer()">✕</button>`;

  const body = `
    <div class="evidence-shot" style="aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#1a2331;color:#fff;">
      <div style="text-align:center;padding:12px;">
        <div style="font-size:32px;">📷</div>
        <div style="font-family:var(--font-mono);font-size:11px;color:#8FA0B8;margin-top:6px;">Evidence: runtime/evidence/${inc.incident_id}.jpg</div>
        <div style="font-size:11px;color:#48bb78;margin-top:2px;">YOLO Detection · ByteTrack Confirmed</div>
      </div>
    </div>

    <div class="section-title">Detection Details</div>
    <dl class="kv">
      <dt>Defect Type</dt><dd>${(inc.event_type||'').replace('_',' ')}</dd>
      <dt>Severity</dt><dd>${sevBadge(inc.severity)}</dd>
      <dt>AI Confidence</dt><dd>${Math.round((inc.confidence||0.9)*100)}%</dd>
      <dt>Observations</dt><dd class="mono">${inc.observation_count || 1} independent bus detections</dd>
      <dt>Coordinates</dt><dd class="mono">${inc.latitude ? Number(inc.latitude).toFixed(4)+'°, '+Number(inc.longitude).toFixed(4)+'°' : 'Road snapped'}</dd>
      <dt>Department</dt><dd>${(inc.department||'MUNICIPAL_CORPORATION').replace('_',' ')}</dd>
      <dt>First Observed</dt><dd>${fmtTime(inc.first_observed_at)}</dd>
      <dt>Linked Ticket</dt><dd>${ticket ? `<span class="mono">${ticket.ticket_id}</span>` : '<span style="color:var(--ink-faint)">No ticket raised yet</span>'}</dd>
    </dl>

    <div class="section-title">Incident Description</div>
    <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.55;">
      ${inc.description || 'Road defect corroborated by fleet edge sensors. Verified by Fleet Fusion engine.'}
    </p>

    ${ticket ? `<div class="section-title">Civic Ticket Lifecycle</div>${renderTimelineHTML(ticket)}` : ''}
  `;

  const foot = `
    <a class="btn ghost sm" href="${gmapsLink(inc.latitude,inc.longitude)}" target="_blank" rel="noopener">
      📍 Navigate on Google Maps
    </a>
    ${ticket
      ? `<button class="btn sm primary" onclick="openTicketDrawer('${ticket.ticket_id}')">Open Ticket (${ticket.status})</button>`
      : `<button class="btn sm primary" onclick="raiseTicketForIncident('${inc.incident_id}')">⚡ Raise Civic Ticket</button>`
    }
  `;
  openDrawer(head, body, foot);
}

function renderTimelineHTML(ticket){
  const timeline = ticket.timeline || [
    { label: "Reported", done: true, time: fmtTime(ticket.created_at) },
    { label: "Acknowledged", done: ticket.status !== 'REPORTED', time: "Pending" },
    { label: "In Progress", done: ticket.status === 'IN_PROGRESS' || ticket.status === 'RESOLVED', time: "Pending" },
    { label: "Resolved", done: ticket.status === 'RESOLVED', time: "Pending" }
  ];

  return `<div class="stepper">
    ${timeline.map((s,i)=>{
      return `<div class="step ${s.done?'done':''}">
        <div class="node"></div>
        <div>
          <div class="stitle">${s.label}</div>
          <div class="stime">${s.time}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function openTicketDrawer(id){
  const t = state.tickets.find(x=>x.ticket_id===id);
  if(!t) return;
  const inc = state.incidents.find(i=>i.incident_id===t.incident_id);

  const head = `
    <div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="badge type">${(t.event_type||'POTHOLE').replace('_',' ')}</span>
        ${statusBadge(t.status)}
      </div>
      <h3 style="font-family:var(--font-display);font-size:16px;margin-top:8px;">${t.ticket_id}</h3>
      <div class="mono" style="margin-top:2px;">Work Order: ${t.workorder_id || 'WO-2026-PENDING'}</div>
    </div>
    <button class="iconbtn x" onclick="closeDrawer()">✕</button>`;

  const body = `
    <dl class="kv">
      <dt>Incident ID</dt><dd class="mono">${t.incident_id}</dd>
      <dt>Assigned To</dt><dd>${t.department || 'Ward Maintenance'}</dd>
      <dt>Defect Type</dt><dd>${(t.event_type||'').replace('_',' ')}</dd>
      <dt>Repair SLA</dt><dd>${t.estimated_repair_sla_hours || 48} Hours</dd>
      <dt>Created At</dt><dd>${fmtTime(t.created_at)}</dd>
      <dt>Coordinates</dt><dd class="mono">${t.latitude ? Number(t.latitude).toFixed(4)+'°, '+Number(t.longitude).toFixed(4)+'°' : 'Pune Corridor'}</dd>
    </dl>

    <div class="section-title">Authority Lifecycle Progress</div>
    ${renderTimelineHTML(t)}

    <div class="section-title">Resolution Verification</div>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <div style="flex:1;background:var(--surface-sunken);border:1px solid var(--border);border-radius:6px;padding:8px;text-align:center;">
        <div style="font-size:10px;font-weight:700;color:var(--ink-faint);">BEFORE REPAIR</div>
        <div style="font-size:24px;margin-top:4px;">⚠️</div>
        <div style="font-size:10.5px;color:var(--red);font-weight:600;">High Severity</div>
      </div>
      <div style="flex:1;background:${t.status==='RESOLVED'?'var(--green-soft)':'var(--surface-sunken)'};border:1px solid var(--border);border-radius:6px;padding:8px;text-align:center;">
        <div style="font-size:10px;font-weight:700;color:var(--ink-faint);">AFTER REPAIR</div>
        <div style="font-size:24px;margin-top:4px;">${t.status==='RESOLVED'?'✅':'⏳'}</div>
        <div style="font-size:10.5px;color:${t.status==='RESOLVED'?'var(--green)':'var(--ink-faint)'};font-weight:600;">
          ${t.status==='RESOLVED'?'Visual Verified':'Awaiting Re-pass'}
        </div>
      </div>
    </div>
  `;

  const nextStage = { REPORTED:'ACKNOWLEDGED', ACKNOWLEDGED:'IN_PROGRESS', IN_PROGRESS:'RESOLVED' }[t.status];

  const foot = `
    <a class="btn ghost sm" href="${t.google_maps_url || gmapsLink(t.latitude,t.longitude)}" target="_blank" rel="noopener">
      📍 Navigate
    </a>
    <button class="btn primary sm" ${!nextStage?'disabled':''} onclick="advanceTicketStatus('${t.ticket_id}')">
      ${nextStage ? 'Advance to ' + nextStage.replace('_',' ') : 'Lifecycle Complete'}
    </button>
  `;
  openDrawer(head, body, foot);
}

// Live Backend Ticket Lifecycle Status Transition
async function advanceTicketStatus(ticketId){
  const t = state.tickets.find(x=>x.ticket_id===ticketId);
  if(!t) return;
  const order = ['REPORTED','ACKNOWLEDGED','IN_PROGRESS','RESOLVED'];
  const idx = order.indexOf(t.status);
  if(idx < order.length - 1){
    const nextStatus = order[idx + 1];
    try {
      const res = await fetch(`/api/v1/tickets/${encodeURIComponent(ticketId)}/status?new_status=${encodeURIComponent(nextStatus)}`, {
        method: 'PATCH'
      });
      if(res.ok){
        const updated = await res.json();
        t.status = nextStatus;
        if(updated.ticket && updated.ticket.timeline) t.timeline = updated.ticket.timeline;
        openTicketDrawer(ticketId);
        await fetchLiveBackendData();
      }
    } catch(err){
      console.error("Failed to advance ticket status:", err);
    }
  }
}

// Raise ticket for an un-ticketed incident directly via API
async function raiseTicketForIncident(incidentId){
  const inc = state.incidents.find(i=>i.incident_id===incidentId);
  if(!inc) return;

  const newTicketId = `POT-2026-${String(Math.floor(Math.random()*900000)+100000)}`;
  const now = new Date().toISOString();
  const payload = {
    ticket_id: newTicketId,
    incident_id: inc.incident_id,
    workorder_id: `WO-2026-${newTicketId.split('-')[2]}`,
    event_type: inc.event_type || 'POTHOLE',
    confidence: inc.confidence || 0.92,
    latitude: inc.latitude || 18.5204,
    longitude: inc.longitude || 73.8567,
    evidence_image: `runtime/evidence/${inc.incident_id}.jpg`,
    google_maps_url: gmapsLink(inc.latitude, inc.longitude),
    estimated_repair_sla_hours: 48,
    status: 'REPORTED',
    created_at: now,
    updated_at: now,
  };

  try {
    const res = await fetch('/api/v1/tickets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(res.ok){
      alert(`Civic Ticket ${newTicketId} dispatched successfully!`);
      await fetchLiveBackendData();
      openTicketDrawer(newTicketId);
    }
  } catch(e){
    alert("Error raising ticket: " + e);
  }
}

function openBusDrawer(busId){
  const b = state.fleet.find(x=>x.bus_id===busId);
  if(!b) return;

  const head = `
    <div>
      <span class="status-pill ${b.status==='ONLINE'?'online':'offline'}">
        <span class="dot" style="background:${b.status==='ONLINE'?'var(--green)':'var(--red)'}"></span>
        ${b.status}
      </span>
      <h3 style="font-family:var(--font-display);font-size:16px;margin-top:8px;" class="mono">${b.bus_id}</h3>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${b.route_name || b.route_id}</div>
    </div>
    <button class="iconbtn x" onclick="closeDrawer()">✕</button>`;

  const body = `
    <dl class="kv">

      <dt>Uplink Transport</dt><dd>MQTT (QoS 1) + SQLite WAL</dd>

function updateDashboardStats(){
  const kTotal = document.getElementById('kpiTotal');
  const kVer = document.getElementById('kpiVerified');
  const kTk = document.getElementById('kpiTickets');
  const kFlt = document.getElementById('kpiFleet');
  if(kTotal) kTotal.textContent = state.stats.total_incidents;
  if(kVer) kVer.textContent = state.stats.verified_incidents;
  if(kTk) kTk.textContent = state.stats.open_tickets;
  if(kFlt) kFlt.textContent = `${state.stats.fleet_online}/${state.stats.fleet_total}`;
}

function updateDashboardTable(){
  const wrap = document.getElementById('dashboardTableWrap');
  if(wrap) wrap.innerHTML = renderIncidentsTable(filterIncidents(state.incidents).slice(0, 6));
}

function toggleLayer(layerName, visible){
  if(!state.leafletMap) return;
  if(layerName==='routes'){
    if(visible) state.leafletMap.addLayer(state.routesLayer);
    else state.leafletMap.removeLayer(state.routesLayer);
  } else if(layerName==='markers'){
    if(visible) state.leafletMap.addLayer(state.markersLayer);
    else state.leafletMap.removeLayer(state.markersLayer);
  } else if(layerName==='buses'){
    if(visible) state.leafletMap.addLayer(state.busesLayer);
    else state.leafletMap.removeLayer(state.busesLayer);
  }
}

function renderIncidentsTable(list){
  if(!list.length){
    return `
      <div class="empty">
        No incidents reported yet.<br>
        <button class="btn sm primary" style="margin-top:10px;" onclick="triggerSeedData()">Load Working Pune Dataset</button>
      </div>`;
  }

  return `<table>
    <thead>
      <tr>
        <th>Incident ID</th>
        <th>Defect Type</th>
        <th>Locality</th>
        <th>Severity</th>
        <th>Confidence</th>
        <th>Buses</th>
        <th>Status</th>
        <th>Observed</th>
      </tr>
    </thead>
    <tbody>
      ${list.map(i=>`
        <tr onclick="openIncidentDrawer('${i.incident_id}')">
          <td class="mono">${i.incident_id}</td>
          <td><span class="badge type">${(i.event_type||'').replace('_',' ')}</span></td>
          <td>${i.locality || 'Pune Corridor'}</td>
          <td>${sevBadge(i.severity)}</td>
          <td>${Math.round((i.confidence||0.9)*100)}%</td>
          <td class="mono">${i.observation_count || 1}</td>
          <td>${statusBadge(i.status)}</td>
          <td>${fmtTime(i.first_observed_at || i.last_observed_at)}</td>
        </tr>`).join('')}
    </tbody>
  </table>`;
}

function pageIncidents(){
  const list = filterIncidents(state.incidents);
  return `
    <div class="filters">
      <button class="btn sm primary" onclick="triggerSeedData()">🌱 Seed Working Data</button>
      <span style="font-size:12px;color:var(--ink-faint);margin-left:auto;">${list.length} total incidents</span>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>All Detected Road Defects</h3></div>
      <div class="panel-body" style="padding-top:0;">
        ${renderIncidentsTable(list)}
      </div>
    </div>`;
}

function pageTickets(){
  const cols = ['REPORTED','ACKNOWLEDGED','IN_PROGRESS','RESOLVED'];

  return `
    <div class="filters">
      <span style="font-size:12px;font-weight:600;">Civic Work Orders (SLA Dispatch)</span>
      <span style="font-size:12px;color:var(--ink-faint);margin-left:auto;">${state.tickets.length} total tickets</span>
    </div>
    <div class="kanban">
      ${cols.map(c=>{
        const items = state.tickets.filter(t=>t.status===c);
        return `
          <div>
            <div class="kcol-head">
              <h4>${labels[c]}</h4>
              <span class="n">${items.length}</span>
            </div>
            <div class="kcol-body">
              ${items.length ? items.map(t=>`
                <div class="tcard" onclick="openTicketDrawer('${t.ticket_id}')">

                  <div class="ttype">${(t.event_type||'POTHOLE').replace('_',' ')}</div>
                  <div class="tloc">${t.department || 'Ward Maintenance'}</div>

                    ${sevBadge(t.priority || 'MEDIUM')}
                    <span class="sla">${t.estimated_repair_sla_hours||48}h SLA</span>
                  </div>
                </div>
              `).join('') : '<div class="empty" style="padding:20px 0;">No tickets</div>'}

          </div>`;
      }).join('')}
    </div>`;
}

/* ============ ROUTER & INITIALIZATION ============ */
function renderPage(){
  const r = ROUTES.find(x=>x.id===state.route) || ROUTES[0];
  document.getElementById('pageTitle').textContent = r.label;
  document.getElementById('pageSub').textContent = r.sub;

  const fns = {
    dashboard: pageDashboard,
    incidents: pageIncidents,
    tickets: pageTickets,
    buses: pageBuses,
    authorities: pageAuthorities,
    settings: pageSettings
  };

  const content = document.getElementById('content');
  content.innerHTML = (fns[state.route] || pageDashboard)();

  if(state.route==='dashboard'){
    initLeafletMap();
  }
}

function render(){
  renderNav();
  renderPage();
  closeDrawer();
}

// Initial Boot
render();
fetchLiveBackendData();

// Live Polling Engine (Every 4 seconds)
setInterval(()=>{
  fetchLiveBackendData();
}, 4000);
