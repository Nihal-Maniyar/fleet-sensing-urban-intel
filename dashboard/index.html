<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet Sensing Urban Intel — Pune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --font-display:'Space Grotesk','Segoe UI',sans-serif;
  --font-body:'Inter','Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',monospace;

  --ink:#101826;
  --ink-soft:#5B6472;
  --ink-faint:#8A93A3;
  --surface:#FFFFFF;
  --surface-sunken:#F3F5F9;
  --surface-raised:#FFFFFF;
  --border:#E1E5EC;
  --border-soft:#EDF0F4;

  --navy:#0E1B2C;
  --navy-soft:#16283F;
  --navy-line:#24384F;

  --teal:#1C6E8C;
  --teal-ink:#0F4A61;
  --teal-soft:#E3F0F4;

  --amber:#CC7A2E;
  --amber-soft:#FBEEDD;

  --green:#2E7D53;
  --green-soft:#E3F3E9;

  --red:#B94A3B;
  --red-soft:#F8E5E2;

  --shadow-sm:0 1px 2px rgba(16,24,38,0.06);
  --shadow-md:0 6px 20px rgba(16,24,38,0.08);
  --radius:10px;
  --radius-sm:6px;

  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDEFF3; --ink-soft:#AEB6C4; --ink-faint:#7A8497;
    --surface:#141B27; --surface-sunken:#0F1622; --surface-raised:#1A2331;
    --border:#263042; --border-soft:#1E2735;
    --teal-soft:#173038; --amber-soft:#2E2416; --green-soft:#16281E; --red-soft:#2C1B18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEFF3; --ink-soft:#AEB6C4; --ink-faint:#7A8497;
  --surface:#141B27; --surface-sunken:#0F1622; --surface-raised:#1A2331;
  --border:#263042; --border-soft:#1E2735;
  --teal-soft:#173038; --amber-soft:#2E2416; --green-soft:#16281E; --red-soft:#2C1B18;
  color-scheme: dark;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:var(--surface-sunken);
  color:var(--ink);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

/* ============ APP SHELL ============ */
.app{ display:flex; min-height:100%; }

/* ---- Sidebar ---- */
.sidebar{
  width:230px; min-width:230px;
  background:var(--navy);
  color:#DDE4EE;
  display:flex; flex-direction:column;
  padding:18px 12px calc(16px + env(safe-area-inset-bottom,0px));
  position:sticky; top:0; align-self:flex-start; height:100vh;
}
.brand{ display:flex; align-items:center; gap:10px; padding:6px 10px 20px; }
.brand-mark{
  width:34px; height:34px; border-radius:9px;
  background:linear-gradient(155deg, var(--teal), #123246);
  display:flex; align-items:center; justify-content:center;
  font-size:17px; flex-shrink:0;
}
.brand-text .t1{ font-family:var(--font-display); font-weight:700; font-size:14.5px; line-height:1.15; color:#F3F6FA;}
.brand-text .t2{ font-size:10.5px; color:#8FA0B8; letter-spacing:.02em; margin-top:2px;}

.nav{ display:flex; flex-direction:column; gap:2px; margin-top:6px; flex:1; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:10px 12px; border-radius:8px;
  color:#B7C2D2; background:transparent; border:none; width:100%; text-align:left;
  font-size:13.5px; font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.9;}
.nav-item:hover{ background:var(--navy-soft); color:#F0F3F8; }
.nav-item.active{ background:var(--teal); color:#fff; }
.nav-item .cnt{
  margin-left:auto; font-size:10.5px; font-family:var(--font-mono);
  background:rgba(255,255,255,0.12); padding:1px 6px; border-radius:999px; color:#EAF0F6;
}
.nav-item.active .cnt{ background:rgba(255,255,255,0.25); }

.sidebar-foot{
  margin-top:10px; padding:12px 12px 4px; border-top:1px solid var(--navy-line);
  font-size:11px; color:#7488A0; line-height:1.5;
}
.sidebar-foot b{ color:#B7C2D2; }

/* ---- Main column ---- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }

/* ---- Topbar ---- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 22px; display:flex; align-items:center; gap:16px;
}
.topbar h1{ font-family:var(--font-display); font-size:17px; font-weight:700; white-space:nowrap;}
.topbar .sub{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; white-space:nowrap;}
.search{
  flex:1; max-width:360px; display:flex; align-items:center; gap:8px;
  background:var(--surface-sunken); border:1px solid var(--border); border-radius:999px;
  padding:8px 14px; color:var(--ink-faint); font-size:12.5px;
}
.search svg{ width:14px; height:14px; flex-shrink:0;}
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.datasource{
  display:flex; align-items:center; gap:7px;
  border:1px solid var(--border); border-radius:999px; padding:6px 12px 6px 10px;
  font-size:12px; font-weight:600; background:var(--surface-sunken); position:relative;
}
.dot{ width:7px; height:7px; border-radius:50%; background:var(--green); flex-shrink:0;}
.dot.pulse{ box-shadow:0 0 0 0 rgba(46,125,83,.5); animation:pulse 2s infinite;}
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(46,125,83,.45);} 70%{box-shadow:0 0 0 7px rgba(46,125,83,0);} 100%{box-shadow:0 0 0 0 rgba(46,125,83,0);} }
.clock{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
.iconbtn{
  width:34px; height:34px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); display:flex; align-items:center; justify-content:center; position:relative;
}
.iconbtn svg{ width:16px; height:16px; color:var(--ink-soft);}
.badge-dot{ position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--red); border:1.5px solid var(--surface);}

/* ---- Content ---- */
.content{ padding:20px 22px 48px; max-width:1400px; width:100%; margin:0 auto; }
.page-head{ margin-bottom:16px; }
.page-head h2{ font-family:var(--font-display); font-size:19px; font-weight:700; }
.page-head p{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; max-width:640px; }

/* ============ COMPONENTS ============ */
.kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; box-shadow:var(--shadow-sm);
}
.kpi .label{ font-size:11px; color:var(--ink-faint); font-weight:600; display:flex; justify-content:space-between; align-items:center;}
.kpi .value{ font-family:var(--font-display); font-size:26px; font-weight:700; margin-top:6px;}
.kpi .delta{ font-size:11px; margin-top:5px; font-weight:600;}
.kpi .delta.up{ color:var(--green);} .kpi .delta.down{ color:var(--red);}

.grid-2{ display:grid; grid-template-columns:1.55fr 1fr; gap:14px; align-items:start;}
.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); overflow:hidden;
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 16px; border-bottom:1px solid var(--border-soft);
}
.panel-head h3{ font-family:var(--font-display); font-size:13.5px; font-weight:700;}
.panel-head .link{ font-size:11.5px; color:var(--teal); font-weight:600;}
.panel-body{ padding:14px 16px; }

/* Map (custom illustrative SVG map) */
.map-wrap{ position:relative; background:#DCE7E4; }
:root[data-theme="dark"] .map-wrap, @media (prefers-color-scheme:dark){ .map-wrap{ background:#0F1D1B; } }
.map-svg{ width:100%; display:block; }
.map-legend{
  position:absolute; top:12px; right:12px; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:8px 10px; font-size:11px; box-shadow:var(--shadow-sm);
}
.map-legend div{ display:flex; align-items:center; gap:6px; padding:2px 0;}
.map-legend span.sw{ width:9px; height:9px; border-radius:50%; display:inline-block;}
.map-pin{ cursor:pointer; }
.map-pin circle.ring{ opacity:0; transition:opacity .15s; }
.map-pin:hover circle.ring, .map-pin.selected circle.ring{ opacity:.35; }
.map-badge{
  position:absolute; bottom:10px; left:12px; background:rgba(14,27,44,0.85); color:#fff;
  font-size:10.5px; padding:5px 10px; border-radius:999px; font-family:var(--font-mono);
}

/* Table */
table{ width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  text-align:left; font-size:10.5px; color:var(--ink-faint); font-weight:700;
  padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{ padding:10px 10px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
tbody tr{ transition:background .12s ease; cursor:pointer;}
tbody tr:hover{ background:var(--surface-sunken); }
.mono{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft);}

.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;
  padding:3px 8px; border-radius:999px; white-space:nowrap;
}
.badge.sev-high{ background:var(--red-soft); color:var(--red);}
.badge.sev-medium{ background:var(--amber-soft); color:var(--amber);}
.badge.sev-low{ background:var(--green-soft); color:var(--green);}
.badge.st-reported{ background:var(--amber-soft); color:var(--amber);}
.badge.st-acknowledged{ background:var(--teal-soft); color:var(--teal-ink);}
.badge.st-inprogress{ background:#E7E1F7; color:#5B3FA8;}
.badge.st-resolved{ background:var(--green-soft); color:var(--green);}
.badge.type{ background:var(--surface-sunken); color:var(--ink-soft); border:1px solid var(--border);}

.filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
select, .btn, input[type=text]{
  font-family:inherit; font-size:12px; border:1px solid var(--border); border-radius:8px;
  padding:8px 11px; background:var(--surface); color:var(--ink);
}
.btn{ font-weight:600; display:inline-flex; align-items:center; gap:6px; }
.btn.primary{ background:var(--teal); border-color:var(--teal); color:#fff; }
.btn.primary:hover{ background:var(--teal-ink); }
.btn.ghost{ background:transparent; }
.btn.sm{ padding:6px 10px; font-size:11.5px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* Drawer */
.overlay{
  position:fixed; inset:0; background:rgba(10,16,26,0.42); z-index:60;
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.overlay.open{ opacity:1; pointer-events:auto; }
.drawer{
  position:fixed; top:0; right:0; height:100%; width:min(440px,92vw); z-index:61;
  background:var(--surface); box-shadow:-12px 0 30px rgba(10,16,26,0.18);
  transform:translateX(100%); transition:transform .22s ease;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{ transform:translateX(0); }
.drawer-head{ padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:10px;}
.drawer-head .x{ margin-left:auto; }
.drawer-body{ padding:16px 18px; overflow-y:auto; flex:1; }
.drawer-foot{ padding:14px 18px; border-top:1px solid var(--border); display:flex; gap:8px; }

.kv{ display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:12.5px; }
.kv dt{ color:var(--ink-faint); font-weight:600; }
.kv dd{ font-weight:600; }

.evidence-shot{ border-radius:8px; overflow:hidden; border:1px solid var(--border); background:var(--surface-sunken); }
.evidence-strip{ display:flex; gap:6px; margin-top:8px; }
.evidence-strip .mini{ width:54px; height:54px; border-radius:6px; overflow:hidden; border:1px solid var(--border); flex-shrink:0;}

.stepper{ display:flex; flex-direction:column; gap:0; margin-top:4px;}
.step{ display:flex; gap:10px; position:relative; padding-bottom:18px;}
.step:last-child{ padding-bottom:0; }
.step .node{ width:16px; height:16px; border-radius:50%; border:2.5px solid var(--border); background:var(--surface); flex-shrink:0; margin-top:1px; z-index:1;}
.step.done .node{ background:var(--teal); border-color:var(--teal); }
.step.current .node{ background:#fff; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft);}
.step:not(:last-child)::before{
  content:''; position:absolute; left:7.5px; top:16px; bottom:0; width:1.5px; background:var(--border);
}
.step.done:not(:last-child)::before{ background:var(--teal); }
.step .stitle{ font-size:12.5px; font-weight:700; }
.step .stime{ font-size:11px; color:var(--ink-faint); margin-top:1px;}

.section-title{ font-size:11px; font-weight:700; text-transform:none; color:var(--ink-faint); margin:16px 0 8px; letter-spacing:.01em;}
.section-title:first-child{ margin-top:0; }

/* Buses grid */
.bus-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
.bus-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow-sm); }
.bus-card .top{ display:flex; justify-content:space-between; align-items:flex-start;}
.bus-card .id{ font-family:var(--font-mono); font-weight:700; font-size:14px;}
.bus-card .route{ font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
.status-pill{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; display:flex; align-items:center; gap:5px;}
.status-pill.online{ background:var(--green-soft); color:var(--green);}
.status-pill.offline{ background:var(--surface-sunken); color:var(--ink-faint); border:1px solid var(--border);}
.bus-meta{ display:flex; gap:14px; margin-top:12px; font-size:11.5px; }
.bus-meta div span{ display:block; color:var(--ink-faint); font-size:10px; margin-bottom:2px;}

/* Kanban */
.kanban{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.kcol-head{ display:flex; align-items:center; justify-content:space-between; padding:0 2px 10px; }
.kcol-head h4{ font-size:12px; font-weight:700; }
.kcol-head .n{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
.kcol-body{ display:flex; flex-direction:column; gap:8px; min-height:60px; }
.tcard{ background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:11px; box-shadow:var(--shadow-sm); }
.tcard .tid{ font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--teal-ink);}
.tcard .ttype{ font-size:12.5px; font-weight:600; margin-top:4px;}
.tcard .tloc{ font-size:11px; color:var(--ink-soft); margin-top:2px;}
.tcard .tfoot{ display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
.sla{ font-size:10px; font-family:var(--font-mono); color:var(--ink-faint);}
.sla.late{ color:var(--red); font-weight:700;}

/* Fusion queue */
.fusion-card{ border:1px solid var(--border); border-radius:var(--radius); padding:14px; background:var(--surface); margin-bottom:10px;}
.fusion-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.obs-row{ display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px dashed var(--border-soft);}
.obs-row:first-of-type{ border-top:none; }
.busdot{ width:26px; height:26px; border-radius:50%; background:var(--teal-soft); color:var(--teal-ink); font-family:var(--font-mono); font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

/* Authorities */
.auth-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;}
.auth-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow-sm);}
.auth-card h4{ font-size:13.5px; font-weight:700; font-family:var(--font-display);}
.auth-card .desc{ font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
.auth-stats{ display:flex; gap:16px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border-soft);}
.auth-stats div b{ display:block; font-family:var(--font-display); font-size:18px;}
.auth-stats div span{ font-size:10px; color:var(--ink-faint);}

/* Reports bars */
.bars{ display:flex; align-items:flex-end; gap:10px; height:160px; padding-top:10px;}
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
.bar{ width:100%; border-radius:5px 5px 0 0; background:linear-gradient(180deg, var(--teal), var(--teal-ink)); position:relative;}
.bar-col .lab{ font-size:10px; color:var(--ink-faint);}
.bar-col .val{ font-size:10.5px; font-weight:700; font-family:var(--font-mono);}

/* Settings */
.setting-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--border-soft); gap:16px;}
.setting-row:last-child{ border-bottom:none;}
.setting-row .lbl{ font-size:12.5px; font-weight:600;}
.setting-row .hint{ font-size:11px; color:var(--ink-faint); margin-top:2px;}
.toggle2{ display:flex; border:1px solid var(--border); border-radius:999px; padding:2px; background:var(--surface-sunken);}
.toggle2 button{ border:none; background:transparent; padding:6px 12px; border-radius:999px; font-size:11.5px; font-weight:700; color:var(--ink-soft);}
.toggle2 button.on{ background:var(--teal); color:#fff;}
.contract-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
.contract-item{ background:var(--surface-sunken); border:1px solid var(--border); border-radius:8px; padding:9px 11px;}
.contract-item .k{ font-size:10px; color:var(--ink-faint); font-family:var(--font-mono);}
.contract-item .v{ font-size:13px; font-weight:700; font-family:var(--font-mono); margin-top:2px;}

.empty{ text-align:center; padding:36px 10px; color:var(--ink-faint); font-size:12.5px;}

@media (max-width:920px){
  .sidebar{ display:none; }
  .kpi-row{ grid-template-columns:repeat(2,1fr); }
  .grid-2{ grid-template-columns:1fr; }
  .kanban{ grid-template-columns:1fr 1fr; }
  .search{ display:none; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <nav class="sidebar">
    <div class="brand">
      <div class="brand-mark">🛰️</div>
      <div class="brand-text">
        <div class="t1">Fleet Sensing<br>Urban Intel</div>
        <div class="t2">Pune Municipal Pilot</div>
      </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">
      Prototype build for <b>SIH 2026</b><br>
      Contract v1 · buses report events over MQTT
    </div>
  </nav>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub">Fleet-wide civic sensing overview</div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Search incidents, tickets, buses…</span>
      </div>
      <div class="topbar-right">
        <div class="datasource" id="dsIndicator"></div>
        <div class="clock" id="clock">—</div>
        <button class="iconbtn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          <span class="badge-dot"></span>
        </button>
        <button class="iconbtn" id="themeBtn" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

const MAP_W = 900, MAP_H = 600;
function project(lat,lng){
  const x = ((lng - GEO_BOUNDS.lngMin) / (GEO_BOUNDS.lngMax - GEO_BOUNDS.lngMin)) * MAP_W;
  const y = ((GEO_BOUNDS.latMax - lat) / (GEO_BOUNDS.latMax - GEO_BOUNDS.latMin)) * MAP_H;
  return { x: Math.max(24,Math.min(MAP_W-24,x)), y: Math.max(24,Math.min(MAP_H-24,y)) };
}

      <rect x="122" y="75" width="16" height="24" fill="#3A2A10"/>
      <rect x="122" y="102" width="16" height="6" fill="#3A2A10"/>`;
  } else {

      <circle cx="130" cy="78" r="9" fill="#3A2A10"/>
      <rect x="120" y="88" width="20" height="26" rx="6" fill="#3A2A10"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g${type}" x1="0" y1="0" x2="0" y2="1">

function renderPuneMap(incidentsToShow, selectedId, onClickAttr){

    'M100,470 C260,470 380,420 500,380 C650,330 780,260 870,190',
  ];
  const roadsSVG = roads.map(d=>`<path d="${d}" fill="none" stroke="#B9C4B9" stroke-width="5" stroke-linecap="round" opacity="0.55"/>`).join('');
  const river = 'M20,220 C160,260 260,330 340,300 C440,260 520,340 600,380 C700,430 800,410 880,450';

  const localityLabels = LOCALITIES.map(l=>{
    const p = project(l.lat,l.lng);
    return `<g opacity="0.55"><circle cx="${p.x}" cy="${p.y}" r="2.2" fill="#5B6C60"/>
      <text x="${p.x+6}" y="${p.y+3}" font-family="Inter, sans-serif" font-size="9.5" fill="#4B5A50">${l.name}</text></g>`;
  }).join('');

  const pins = incidentsToShow.map(inc=>{
    const p = project(inc.locality.lat, inc.locality.lng);
    const color = mapMarkerColorHex(inc.type);
    const sel = inc.incident_id===selectedId ? 'selected' : '';
    return `<g class="map-pin ${sel}" ${onClickAttr}="${inc.incident_id}" transform="translate(${p.x},${p.y})">
      <circle class="ring" r="16" fill="${color}"/>
      <path d="M0,-16 C8,-16 13,-10 13,-3 C13,7 0,20 0,20 C0,20 -13,7 -13,-3 C-13,-10 -8,-16 0,-16 Z" fill="${color}" stroke="#fff" stroke-width="1.6"/>
      <circle cx="0" cy="-3" r="4.4" fill="#fff"/>
    </g>`;
  }).join('');

  return `<svg class="map-svg" viewBox="0 0 ${MAP_W} ${MAP_H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="landGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E4EDE5"/><stop offset="1" stop-color="#D3E2D6"/>
      </linearGradient>
      <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="${MAP_W}" height="${MAP_H}" fill="url(#landGrad)"/>
    <rect width="${MAP_W}" height="${MAP_H}" fill="url(#grid)"/>
    <path d="${river}" fill="none" stroke="#9CC4D9" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
    ${roadsSVG}
    ${localityLabels}
    ${pins}
  </svg>`;
}

      <dt>AI confidence</dt><dd>${Math.round(inc.confidence*100)}%</dd>
      <dt>Severity</dt><dd>${sevBadge(inc.severity)}</dd>
      <dt>Coordinates</dt><dd class="mono">${inc.locality.lat.toFixed(4)}°, ${inc.locality.lng.toFixed(4)}°</dd>
      <dt>First detected</dt><dd>${fmtTime(inc.ts)}</dd>
      <dt>Linked ticket</dt><dd>${inc.ticket_id ? `<span class="mono">${inc.ticket_id}</span>` : '<span style="color:var(--ink-faint)">Not yet raised</span>'}</dd>
    </dl>
    <div class="section-title">Description</div>
    <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.55;">${inc.desc}</p>

    ${ticket ? `<div class="section-title">Ticket status</div>${renderStepperHTML(ticket)}` : ''}
  `;

  const foot = `
    <a class="btn ghost sm" href="${gmapsLink(inc.locality.lat,inc.locality.lng)}" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Open in Google Maps
    </a>
    ${ticket ? `<button class="btn sm" onclick="openTicketDrawer('${ticket.ticket_id}')">View ticket</button>`
             : `<button class="btn primary sm" onclick="alert('Ticket ${'POT-2026-XXXXXX'} would be created via the backend Tickets API, above the confidence threshold of ${CONTRACT.TICKET_CONFIDENCE_THRESHOLD}.')">Raise ticket</button>`}
  `;
  openDrawer(head, body, foot);
}

/* ---- Ticket sub-dashboard ---- */
function renderStepperHTML(ticket){
  return `<div class="stepper">
    ${ticket.timeline.map((s,i)=>{
      const isCurrent = !s.done && (i===0 || ticket.timeline[i-1].done);
      return `<div class="step ${s.done?'done':''} ${isCurrent?'current':''}">
        <div class="node"></div>
        <div><div class="stitle">${s.label}</div><div class="stime">${s.time}</div></div>
      </div>`;
    }).join('')}
  </div>`;
}
function openTicketDrawer(id){
  const t = TICKETS.find(x=>x.ticket_id===id);
  if(!t) return;
  const inc = INCIDENTS.find(i=>i.incident_id===t.incident_id);
  const head = `
    <div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="badge type">${t.type.replace('_',' ')}</span>${statusBadge(t.status)}
      </div>
      <h3 style="font-family:var(--font-display);font-size:16px;margin-top:8px;">${t.ticket_id}</h3>
      <div class="mono" style="margin-top:2px;">${inc ? inc.locality.name+', Pune' : ''}</div>
    </div>
    <button class="iconbtn x" onclick="closeDrawer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>`;

  const beforeAfter = t.status==='RESOLVED' ? `
    <div class="section-title">Resolution evidence</div>
    <div style="display:flex;gap:8px;">
      <div style="flex:1;"><div class="evidence-shot" style="aspect-ratio:4/3;">${evidenceSVG(t.type)}</div><div style="font-size:10.5px;color:var(--ink-faint);margin-top:4px;">Before repair</div></div>
      <div style="flex:1;"><div class="evidence-shot" style="aspect-ratio:4/3;background:var(--green-soft);display:flex;align-items:center;justify-content:center;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div><div style="font-size:10.5px;color:var(--ink-faint);margin-top:4px;">After repair (validated)</div></div>
    </div>` : '';

  const body = `
    <dl class="kv">
      <dt>Incident</dt><dd class="mono">${t.incident_id}</dd>
      <dt>Authority</dt><dd>${t.authority}</dd>
      <dt>Priority</dt><dd>${sevBadge(t.priority)}</dd>
      <dt>Repair SLA</dt><dd>${t.sla}</dd>
      <dt>Created</dt><dd>${fmtTime(t.created)}</dd>
      ${inc?`<dt>Coordinates</dt><dd class="mono">${inc.locality.lat.toFixed(4)}°, ${inc.locality.lng.toFixed(4)}°</dd>`:''}
    </dl>
    <div class="section-title">Lifecycle</div>
    ${renderStepperHTML(t)}
    ${beforeAfter}
  `;

  const nextStage = { REPORTED:'ACKNOWLEDGED', ACKNOWLEDGED:'IN_PROGRESS', IN_PROGRESS:'RESOLVED' }[t.status];
  const foot = `
    ${inc ? `<a class="btn ghost sm" href="${gmapsLink(inc.locality.lat,inc.locality.lng)}" target="_blank" rel="noopener">Navigate</a>` : ''}
    <button class="btn primary sm" ${!nextStage?'disabled':''} onclick="advanceTicket('${t.ticket_id}')">
      ${nextStage ? 'Mark ' + nextStage.replace('_',' ') : 'Lifecycle complete'}
    </button>
  `;
  openDrawer(head, body, foot);
}
async function advanceTicket(id){
  const t = TICKETS.find(x=>x.ticket_id===id);
  if(!t) return;
  const order = ['REPORTED','ACKNOWLEDGED','IN_PROGRESS','RESOLVED'];
  const idx = order.indexOf(t.status);
  if(idx < order.length-1){
    const nextStatus = order[idx+1];
    t.status = nextStatus;
    t.timeline[idx+1].done = true;
    t.timeline[idx+1].time = new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

    // Attempt live backend synchronization if running alongside FastAPI
    try {
      await fetch(`/api/v1/tickets/${encodeURIComponent(id)}/status?new_status=${encodeURIComponent(nextStatus)}`, {
        method: 'PATCH'
      });
    } catch (err) {
      // Graceful offline fallback
    }
  }
  openTicketDrawer(id);
  if(state.route==='tickets') renderPage();
}

/* ---- Bus sub-dashboard ---- */
function openBusDrawer(busId){
  const b = BUSES.find(x=>x.bus_id===busId);
  if(!b) return;
  const relatedIncidents = INCIDENTS.filter(i=>i.observations.includes(busId));
  const head = `
    <div>
      <span class="status-pill ${b.status}"><span class="dot" style="background:${b.status==='online'?'var(--green)':'var(--ink-faint)'}"></span>${b.status==='online'?'Online':'Offline'}</span>
      <h3 style="font-family:var(--font-display);font-size:16px;margin-top:8px;" class="mono">${b.bus_id}</h3>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${b.route}</div>
    </div>
    <button class="iconbtn x" onclick="closeDrawer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>`;
  const body = `
    <dl class="kv">
      <dt>Edge AI</dt><dd>YOLO + ByteTrack (${CONTRACT.TRACKER_TYPE})</dd>
      <dt>Battery</dt><dd>${b.battery}%</dd>
      <dt>Session uptime</dt><dd>${b.uptime}</dd>
      <dt>Last event</dt><dd class="mono">${b.last_event}</dd>
      <dt>Uplink</dt><dd>MQTT · ${state.dataSource==='live'?'Actual Bus Simulator':'Data/Demo Simulator'}</dd>
    </dl>
    <div class="section-title">Observations contributed to incidents</div>
    ${relatedIncidents.length ? relatedIncidents.map(i=>`
      <div class="obs-row" style="cursor:pointer;" onclick="openIncidentDrawer('${i.incident_id}')">
        <div class="busdot">${i.type.slice(0,3)}</div>
        <div style="flex:1;">
          <div style="font-size:12.5px;font-weight:600;">${i.incident_id} · ${i.type.replace('_',' ')}</div>
          <div style="font-size:11px;color:var(--ink-faint);">${i.locality.name}</div>
        </div>
        ${statusBadge(i.status)}
      </div>`).join('') : `<div class="empty">No observations yet this session.</div>`}
  `;
  openDrawer(head, body, '');
}

/* ============ Page renderers ============ */
function pageDashboard(){
  const total = INCIDENTS.length;
  const verified = INCIDENTS.filter(i=>i.status==='verified').length;
  const openTickets = TICKETS.filter(t=>t.status!=='RESOLVED').length;
  const onlineBuses = BUSES.filter(b=>b.status==='online').length;

  return `
  <div class="kpi-row">
    <div class="kpi"><div class="label">Total incidents</div><div class="value">${total}</div><div class="delta up">Fused from ${INCIDENTS.reduce((a,i)=>a+i.observations.length,0)} observations</div></div>
    <div class="kpi"><div class="label">Verified incidents</div><div class="value">${verified}</div><div class="delta up">≥ ${Math.round(CONTRACT.TICKET_CONFIDENCE_THRESHOLD*100)}% confidence auto-tickets</div></div>
    <div class="kpi"><div class="label">Open tickets</div><div class="value">${openTickets}</div><div class="delta down">${TICKETS.filter(t=>t.status==='RESOLVED').length} resolved this pilot</div></div>
    <div class="kpi"><div class="label">Fleet online</div><div class="value">${onlineBuses}/${BUSES.length}</div><div class="delta up">Edge AI streaming live</div></div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h3>Live incident map — Pune</h3><span class="link" onclick="state.route='incidents';render()">Open Incidents →</span></div>
      <div class="map-wrap">
        ${renderPuneMap(INCIDENTS, state.selectedIncident, 'onclick="openIncidentDrawer')}
        <div class="map-legend">
          <div><span class="sw" style="background:#B94A3B"></span>Pothole</div>
          <div><span class="sw" style="background:#2E7D53"></span>Garbage</div>
          <div><span class="sw" style="background:#CC7A2E"></span>Obstruction</div>
          <div><span class="sw" style="background:#5B3FA8"></span>Pedestrian risk</div>
        </div>
        <div class="map-badge">Illustrative road-aligned map · ${INCIDENTS.length} plotted</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Demo scenario</h3></div>
      <div class="panel-body" style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;">
        <p><b style="color:var(--ink);">INC-000001</b> shows the primary storyline: three buses independently detect the same pothole on MG&nbsp;Road within a short window, Fleet Fusion merges the observations into one verified incident, and a civic ticket is auto-raised.</p>
        <button class="btn primary sm" style="margin-top:12px;width:100%;justify-content:center;" onclick="openIncidentDrawer('INC-000001')">Open INC-000001</button>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:14px;">
    <div class="panel-head"><h3>Recent incidents</h3><span class="link" onclick="state.route='incidents';render()">View all →</span></div>
    <div class="panel-body" style="padding-top:0;">
      ${incidentsTable(INCIDENTS.slice(0,6))}
    </div>
  </div>
  `;
}

function incidentsTable(list){
  if(!list.length) return `<div class="empty">No incidents match these filters.</div>`;
  return `<table>
    <thead><tr><th>ID</th><th>Type</th><th>Location</th><th>Severity</th><th>Confidence</th><th>Buses</th><th>Status</th><th>Detected</th></tr></thead>
    <tbody>
      ${list.map(i=>`
        <tr onclick="openIncidentDrawer('${i.incident_id}')">
          <td class="mono">${i.incident_id}</td>
          <td><span class="badge type">${i.type.replace('_',' ')}</span></td>
          <td>${i.locality.name}, Pune</td>
          <td>${sevBadge(i.severity)}</td>
          <td>${Math.round(i.confidence*100)}%</td>
          <td class="mono">${i.observations.length}</td>
          <td>${statusBadge(i.status)}</td>
          <td>${fmtTime(i.ts)}</td>
        </tr>`).join('')}
    </tbody>
  </table>`;
}

function pageIncidents(){
  return `
  <div class="filters">
    <select id="fType"><option value="">All types</option>${[...new Set(INCIDENTS.map(i=>i.type))].map(t=>`<option>${t}</option>`).join('')}</select>
    <select id="fSev"><option value="">All severities</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select>
    <select id="fStatus"><option value="">All statuses</option><option value="verified">Verified</option><option value="pending">Pending fusion</option></select>
    <button class="btn sm" onclick="applyIncidentFilters()">Apply</button>
    <button class="btn ghost sm" onclick="state.route='incidents';render()">Reset</button>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>All incidents</h3><span style="font-size:11px;color:var(--ink-faint);">${INCIDENTS.length} total</span></div>
    <div class="panel-body" style="padding-top:0;" id="incidentsTableWrap">${incidentsTable(INCIDENTS)}</div>
  </div>`;
}
function applyIncidentFilters(){
  const type = document.getElementById('fType').value;
  const sev = document.getElementById('fSev').value;
  const st = document.getElementById('fStatus').value;
  const filtered = INCIDENTS.filter(i => (!type||i.type===type) && (!sev||i.severity===sev) && (!st||i.status===st));
  document.getElementById('incidentsTableWrap').innerHTML = incidentsTable(filtered);
}

function pageBuses(){
  return `<div class="bus-grid">
    ${BUSES.map(b=>`
      <div class="bus-card" style="cursor:pointer;" onclick="openBusDrawer('${b.bus_id}')">
        <div class="top">
          <div><div class="id">${b.bus_id}</div><div class="route">${b.route}</div></div>
          <span class="status-pill ${b.status}"><span class="dot" style="background:${b.status==='online'?'var(--green)':'var(--ink-faint)'}"></span>${b.status==='online'?'Online':'Offline'}</span>
        </div>
        <div class="bus-meta">
          <div><span>Battery</span>${b.battery}%</div>
          <div><span>Uptime</span>${b.uptime}</div>
          <div><span>Last event</span>${b.last_event}</div>
        </div>
      </div>`).join('')}
  </div>`;
}

function pageFusion(){
  return `
  <div class="panel">
    <div class="panel-head"><h3>Pending fusion queue</h3><span style="font-size:11px;color:var(--ink-faint);">Distance ≤ ${CONTRACT.FUSION_DISTANCE_METERS}m · Window ≤ ${CONTRACT.FUSION_TIME_WINDOW_SECONDS}s</span></div>
    <div class="panel-body">
      ${FUSION_QUEUE.map(c=>`
        <div class="fusion-card">
          <div class="fusion-head">
            <span class="badge type">${c.type.replace('_',' ')}</span>
            <span style="font-size:12.5px;font-weight:600;">${c.locality.name}, Pune</span>
            <span class="mono" style="margin-left:auto;font-size:11px;color:var(--ink-faint);">${c.cluster}</span>
          </div>
          ${c.observations.map(o=>`
            <div class="obs-row">
              <div class="busdot">${o.bus_id.slice(4)}</div>
              <div style="flex:1;font-size:12px;">${o.bus_id} <span class="mono" style="color:var(--ink-faint);">· ${o.obs}</span></div>
              <div style="font-size:11.5px;color:var(--ink-soft);">${Math.round(o.confidence*100)}%</div>
              <div style="font-size:11px;color:var(--ink-faint);">${o.time}</div>
            </div>`).join('')}
          <div style="margin-top:10px;font-size:11.5px;color:var(--ink-faint);">
            Awaiting a second independent bus within range before Fleet Fusion can verify this observation.
          </div>
        </div>`).join('')}
    </div>
  </div>

  <div class="panel" style="margin-top:14px;">
    <div class="panel-head"><h3>Verified this pilot</h3></div>
    <div class="panel-body" style="padding-top:0;">${incidentsTable(INCIDENTS.filter(i=>i.status==='verified'))}</div>
  </div>`;
}

function pageTickets(){
  const cols = ['REPORTED','ACKNOWLEDGED','IN_PROGRESS','RESOLVED'];
  const labels = { REPORTED:'Reported', ACKNOWLEDGED:'Acknowledged', IN_PROGRESS:'In Progress', RESOLVED:'Resolved' };
  return `<div class="kanban">
    ${cols.map(c=>{
      const items = TICKETS.filter(t=>t.status===c);
      return `<div>
        <div class="kcol-head"><h4>${labels[c]}</h4><span class="n">${items.length}</span></div>
        <div class="kcol-body">
          ${items.length ? items.map(t=>`
            <div class="tcard" style="cursor:pointer;" onclick="openTicketDrawer('${t.ticket_id}')">
              <div class="tid">${t.ticket_id}</div>
              <div class="ttype">${t.type.replace('_',' ')}</div>
              <div class="tloc">${t.authority}</div>
              <div class="tfoot">${sevBadge(t.priority)}<span class="sla">${t.sla} SLA</span></div>
            </div>`).join('') : `<div class="empty" style="padding:18px 6px;">Empty</div>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function pageAuthorities(){
  return `<div class="auth-grid">
    ${AUTHORITIES.map(a=>`
      <div class="auth-card">
        <h4>${a.name}</h4>
        <div class="desc">${a.desc}</div>
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
          ${a.types.map(t=>`<span class="badge type">${t.replace('_',' ')}</span>`).join('')}
        </div>
        <div class="auth-stats">
          <div><b>${a.open}</b><span>Reported</span></div>
          <div><b>${a.progress}</b><span>In progress</span></div>
          <div><b>${a.resolved}</b><span>Resolved</span></div>
        </div>
      </div>`).join('')}
  </div>`;
}

function pageReports(){
  const byType = {};
  INCIDENTS.forEach(i=>{ byType[i.type]=(byType[i.type]||0)+1; });
  const max = Math.max(...Object.values(byType));
  const resolvedPct = Math.round(TICKETS.filter(t=>t.status==='RESOLVED').length / TICKETS.length * 100);
  return `
  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h3>Incidents by type</h3></div>
      <div class="panel-body">
        <div class="bars">
          ${Object.entries(byType).map(([t,v])=>`
            <div class="bar-col">
              <div class="val">${v}</div>
              <div class="bar" style="height:${(v/max*100).toFixed(0)}%;"></div>
              <div class="lab">${t.replace('_',' ')}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Ticket resolution</h3></div>
      <div class="panel-body">
        <div class="kpi" style="border:none;box-shadow:none;padding:4px 0;">
          <div class="label">Resolved of total tickets</div>
          <div class="value">${resolvedPct}%</div>
        </div>
        <div style="height:8px;background:var(--surface-sunken);border-radius:999px;overflow:hidden;margin-top:6px;">
          <div style="height:100%;width:${resolvedPct}%;background:var(--green);"></div>
        </div>
        <div class="section-title">By authority</div>
        ${AUTHORITIES.map(a=>`
          <div style="display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid var(--border-soft);">
            <span>${a.name}</span><span class="mono">${a.resolved} resolved</span>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function pageSettings(){
  return `
  <div class="panel">
    <div class="panel-head"><h3>Simulation source</h3></div>
    <div class="panel-body">
      <div class="setting-row">
        <div><div class="lbl">Active input</div><div class="hint">Switch without changing backend, database, fusion or dashboard architecture.</div></div>
        <div class="toggle2">
          <button class="${state.dataSource==='live'?'on':''}" onclick="setDataSource('live')">Actual Bus Simulator</button>
          <button class="${state.dataSource==='demo'?'on':''}" onclick="setDataSource('demo')">Data/Demo Simulator</button>
        </div>
      </div>
      <div class="setting-row">
        <div><div class="lbl">Transport</div><div class="hint">Both sources publish the same event/observation contract over MQTT.</div></div>
        <span class="badge type mono">MQTT · fleet/+/events</span>
      </div>
    </div>
  </div>
  <div class="panel" style="margin-top:14px;">
    <div class="panel-head"><h3>Contract thresholds (read-only)</h3></div>
    <div class="panel-body">
      <div class="contract-grid">
        ${Object.entries(CONTRACT).map(([k,v])=>`
          <div class="contract-item"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
      </div>
      <p style="font-size:11.5px;color:var(--ink-faint);margin-top:12px;">Defined centrally per <span class="mono">.env</span> — module owners should not implement alternate threshold logic locally.</p>
    </div>
  </div>`;
}
function setDataSource(v){
  state.dataSource = v; setPref('fsui_datasource', v);
  renderDsIndicator(); renderPage();
}

/* ============ Check for backend connection ============ */
async function checkBackendConnection(){
  try {
    const res = await fetch('/health');
    if (res.ok) {
      state.backendConnected = true;
      renderDsIndicator();
    }
  } catch (err) {
    state.backendConnected = false;
  }
}

/* ============ Router ============ */
function renderPage(){
  const r = ROUTES.find(x=>x.id===state.route);
  document.getElementById('pageTitle').textContent = r.label;
  document.getElementById('pageSub').textContent = r.sub;
  const fns = { dashboard:pageDashboard, buses:pageBuses, incidents:pageIncidents, fusion:pageFusion, tickets:pageTickets, authorities:pageAuthorities, reports:pageReports, settings:pageSettings };
  document.getElementById('content').innerHTML = fns[state.route]();
}
function render(){
  renderNav();
  renderDsIndicator();
  renderPage();
  closeDrawer();
}
render();
checkBackendConnection();
</script>
