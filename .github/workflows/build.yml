name: Build & Package Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    name: Validate build and delivery readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            database/requirements.txt
            data-demo-simulator/requirements.txt
            bus-simulator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f database/requirements.txt ]; then pip install -r database/requirements.txt; fi
          if [ -f data-demo-simulator/requirements.txt ]; then pip install -r data-demo-simulator/requirements.txt; fi
          if [ -f bus-simulator/requirements.txt ]; then pip install -r bus-simulator/requirements.txt; fi
          python -m pip install pytest httpx

      - name: Validate database migrations head
        run: |
          alembic -c alembic.ini heads

      - name: Validate Docker Compose infrastructure syntax
        run: |
          docker compose -f docker-compose.yml config

      - name: Run end-to-end demo sanity verification
        run: |
          python scripts/run_demo.py --delay 0.0

  package-release:
    name: Package release bundle
    runs-on: ubuntu-latest
    needs: validate-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package clean release distribution archive
        run: |
          mkdir -p dist
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='.venv' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.pytest_cache' \
              --exclude='runtime/evidence/*.jpg' \
              --exclude='dist' \
              -czvf dist/beyonders-urban-intel-${{ github.sha }}.tar.gz .

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: beyonders-urban-intel-${{ github.sha }}
          path: dist/*.tar.gz
          retention-days: 7
